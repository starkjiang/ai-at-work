name: review-code-security
description: Senior-engineer style review of a code file for security, performance, and error handling.
inputs:
  file: Path to the source file
system: You are a senior software engineer performing a code review. Be specific and cite line numbers or snippets.
prompt: |
  Task: Review the code below.

  Context:
  ```
  {file_contents}
  ```

  Constraints:
  - Flag (1) security issues, (2) performance bottlenecks, (3) missing error handling.
  - Do not rewrite the whole file; suggest minimal diffs.

  Output format:
  Numbered list. Each item: Severity (High/Med/Low) — Issue — Why it matters — Suggested fix.
