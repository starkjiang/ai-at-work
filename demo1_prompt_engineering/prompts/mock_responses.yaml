skill_analyze: |
  **Key trends**
  - Total Q4 actual is $11.62M against a $12.34M target (−5.8%).
  - Gulf Coast (−23.5%) and Southwest (−14.7%) remain the two largest gaps; Gulf Coast worsened versus Q3.
  - Midwest, Great Lakes, Mountain, and Mexico met or beat target.

  **Anomalies**
  - Gulf Coast returns rose to 63 on fewer units — return rate 3.9%, highest in the set.

  **Suggested chart**: horizontal bar of gap % by region, sorted, with a zero line.

skill_summarize_meeting: |
  **Decisions**
  - Ship the supplier scorecard to regional leads by Friday.
  - Freeze new-vendor onboarding in Gulf Coast until the returns review completes.

  **Action items**
  | Owner | Action | Due |
  |---|---|---|
  | Priya | Pull return root-cause codes for Southwest and Gulf Coast | Wed |
  | Marcus | Re-baseline Canada target using trailing four quarters | Thu |
  | Dana | Draft supplier email for the lowest on-time performer | Fri |

  **Open questions**
  - Do we escalate the Gulf Coast supplier to procurement leadership this quarter?

skill_draft_email: |
  Subject: Q4 on-time delivery — next steps

  Hi [Supplier contact],

  Your on-time rate for Q4 came in at 71%, against the 95% agreed in our service
  terms. Three of the late shipments blocked production runs in our Gulf Coast
  facility.

  We value the relationship and want to fix this together. Please send a corrective
  action plan by [date] covering root causes and the timeline to return to 95%.

  Could you confirm receipt of this note by end of week?

  Regards,
  [Name]

office1: |
  This table is a monthly supplier performance log. Each row is one supplier in one month:
  `supplier_id` and `supplier_name` identify the vendor, `category` is what they supply
  (hydraulics, electronics, castings, fasteners, rubber & seals, steel), and `region` is where
  they ship to. `shipments` and `late_shipments` are counts for the month, `on_time_pct` is
  the derived percentage, `defects` counts rejected units, and `spend_usd` is what we paid.

  It covers January through December 2026 for 40 suppliers, so roughly 480 rows. A few rows
  have a blank region and the file appears to contain a couple of repeated rows, so I would
  de-duplicate before totaling anything.

