# run1 is deliberately vague, run5 exposes a small arithmetic slip to discuss.
run1: |
  I'd be happy to help analyze your data! However, I don't see any data attached
  to your message. Could you share the dataset you'd like me to look at?

  In general, a good analysis covers descriptive statistics, trends over time,
  outliers, and correlations between variables. Once you provide the data, I can
  suggest the most relevant approach.

run2: |
  Here is an initial analysis of the Q3 regional sales sample:

  - **Southeast** is the strongest region shown, at $1.51M against a $1.40M target.
  - **Midwest** and **West** are close to target (within ~5%).
  - **Northeast** and **Southwest** are below target; Southwest has the widest gap
    and also the highest returns (90), which may be worth investigating.

  With the remaining rows I could rank all regions, compute total variance to plan,
  and look at returns as a percentage of units. Would you like me to do that?

